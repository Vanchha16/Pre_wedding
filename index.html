<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#F6E6D8" />
  <title>សិរីមង្គលអាពាហ៍ពិពាហ៍ · តារារិទ្ធ និង លីលី</title>
  <!-- Link preview in Telegram / Facebook (these apps don't run JavaScript, so it is written here). -->
  <meta name="description" content="សូមគោរពអញ្ជើញចូលរួមជាភ្ញៀវកិត្តិយស ក្នុងពិធីអាពាហ៍ពិពាហ៍របស់ អ៊ឹម តារារិទ្ធ និង ឆៃ លីលី" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="សិរីមង្គលអាពាហ៍ពិពាហ៍ · តារារិទ្ធ និង លីលី" />
  <meta property="og:description" content="សូមគោរពអញ្ជើញចូលរួមជាភ្ញៀវកិត្តិយស ក្នុងពិធីអាពាហ៍ពិពាហ៍របស់ អ៊ឹម តារារិទ្ធ និង ឆៃ លីលី" />
  <meta property="og:url" content="https://tararith-lily.netlify.app/" />
  <!-- Must be a full address, or Telegram shows no photo. Change it if the site address changes. -->
  <meta property="og:image" content="https://tararith-lily.netlify.app/photos/cover.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23B8924A'/%3E%3Cpath d='M32 46s-14-8.5-14-18a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 9.5-14 18-14 18z' fill='%23FBF4E8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;1,400&family=Moul&family=Hanuman:wght@400;700&family=Kantumruy+Pro:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="assets/css/invite.css" />
</head>
<body class="is-locked">
  <!-- Opening: guest name + curtain -->
  <section id="opening" class="opening" aria-label="Invitation cover">
    <div class="curtain curtain--left"><div class="curtain__slides" data-slides></div></div>
    <div class="curtain curtain--right"><div class="curtain__slides" data-slides></div></div>
    <div class="opening__veil"></div>
    <div class="opening__card">
      <p class="opening__header" data-t="header"></p>
      <div class="seal" aria-hidden="true"><span data-fill="initials"></span></div>
      <h1 class="opening__names" data-fill="shortNames"></h1>
      <p class="opening__date" data-fill="dateShort"></p>
      <div class="opening__guest">
        <p class="opening__dear" data-t="dear"></p>
        <p class="opening__guest-name" id="guestNameCover"></p>
      </div>
      <button class="btn btn--primary opening__btn" id="openBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
        <span data-t="open"></span>
      </button>
    </div>
  </section>

  <main id="main" class="main">
    <!-- Hero -->
    <header class="hero">
      <img class="hero__img" data-fill="coverImg" alt="" fetchpriority="high" />
      <div class="hero__shade"></div>
      <div class="hero__text">
        <p class="hero__header" data-t="header"></p>
        <h2 class="hero__names" data-fill="shortNames"></h2>
        <p class="hero__date" data-fill="dateShort"></p>
      </div>
      <a class="hero__scroll" href="#invite" aria-label="Scroll down"><span></span></a>
    </header>

    <!-- Invitation text + parents -->
    <section id="invite" class="section section--paper">
      <div class="ornament" aria-hidden="true"></div>
      <div class="guest-block reveal" id="guestBlock" hidden>
        <p class="guest-block__dear" data-t="dear"></p>
        <p class="guest-block__name" id="guestNameMain"></p>
      </div>
      <p class="invite-text reveal" data-fill="inviteText"></p>
      <div class="parents reveal" data-section="parents">
        <div class="parents__col">
          <p class="label" data-t="groomParents"></p>
          <p class="parents__name" data-fill="groomFather"></p>
          <p class="parents__name" data-fill="groomMother"></p>
        </div>
        <div class="parents__col">
          <p class="label" data-t="brideParents"></p>
          <p class="parents__name" data-fill="brideFather"></p>
          <p class="parents__name" data-fill="brideMother"></p>
        </div>
      </div>
      <div class="couple reveal">
        <div class="couple__person">
          <p class="label" data-t="groom"></p>
          <p class="couple__name" data-fill="groom"></p>
        </div>
        <span class="couple__amp" aria-hidden="true">&amp;</span>
        <div class="couple__person">
          <p class="label" data-t="bride"></p>
          <p class="couple__name" data-fill="bride"></p>
        </div>
      </div>
    </section>

    <!-- Date + countdown -->
    <section class="section section--blush" id="date">
      <h2 class="title reveal" data-t="saveDate"></h2>
      <div class="date-card reveal">
        <span class="date-card__side" data-fill="weekday"></span>
        <span class="date-card__day" data-fill="day"></span>
        <span class="date-card__side" data-fill="monthYear"></span>
      </div>
      <p class="date-time reveal" data-fill="timeLong"></p>
      <div class="countdown reveal" id="countdown" data-section="countdown">
        <p class="countdown__title" data-t="countdownTitle"></p>
        <div class="countdown__grid">
          <div class="countdown__cell"><b data-cd="d">0</b><span data-t="days"></span></div>
          <div class="countdown__cell"><b data-cd="h">0</b><span data-t="hours"></span></div>
          <div class="countdown__cell"><b data-cd="m">0</b><span data-t="minutes"></span></div>
          <div class="countdown__cell"><b data-cd="s">0</b><span data-t="seconds"></span></div>
        </div>
      </div>
      <p class="countdown__done reveal" id="countdownDone" data-t="married" hidden></p>
      <a class="btn btn--ghost reveal" id="calendarBtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
        <span data-t="addCal"></span>
      </a>
    </section>

    <!-- Program -->
    <section class="section section--paper" data-section="schedule">
      <h2 class="title reveal" data-t="schedule"></h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <!-- Venue -->
    <section class="section section--blush" data-section="venue">
      <h2 class="title reveal" data-t="venue"></h2>
      <p class="venue__name reveal" data-fill="venue"></p>
      <p class="venue__address reveal" data-fill="address"></p>
      <div class="map reveal"><iframe id="mapFrame" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <a class="btn btn--primary reveal" id="mapBtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span data-t="openMap"></span>
      </a>
    </section>

    <!-- Gallery -->
    <section class="section section--paper" data-section="gallery">
      <h2 class="title reveal" data-t="gallery"></h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- Dress code -->
    <section class="section section--blush" data-section="dressCode" id="dressSection">
      <h2 class="title reveal" data-t="dress"></h2>
      <div class="swatches reveal" id="swatches"></div>
      <p class="muted reveal" data-fill="dressNote"></p>
    </section>

    <!-- Gift -->
    <section class="section section--paper" data-section="gift" id="giftSection">
      <h2 class="title reveal" data-t="gift"></h2>
      <p class="muted narrow reveal" data-fill="giftNote"></p>
      <figure class="gift reveal">
        <img id="giftQr" alt="Gift QR code" loading="lazy" />
        <figcaption data-fill="giftAccount"></figcaption>
      </figure>
    </section>

    <!-- RSVP -->
    <section class="section section--blush" data-section="rsvp" data-needs-api>
      <h2 class="title reveal" data-t="rsvp"></h2>
      <form class="form reveal" id="rsvpForm" novalidate>
        <label class="field" id="rsvpNameField">
          <span data-t="yourName"></span>
          <input name="name" maxlength="120" autocomplete="name" required />
        </label>
        <div class="choice" role="radiogroup">
          <label><input type="radio" name="attending" value="yes" required /><span data-t="yes"></span></label>
          <label><input type="radio" name="attending" value="no" /><span data-t="no"></span></label>
        </div>
        <label class="field" id="rsvpCountField">
          <span data-t="people"></span>
          <div class="stepper">
            <button type="button" data-step="-1" aria-label="Less">−</button>
            <input name="guests" type="number" min="1" max="20" value="1" inputmode="numeric" />
            <button type="button" data-step="1" aria-label="More">+</button>
          </div>
        </label>
        <label class="field">
          <span data-t="message"></span>
          <textarea name="message" rows="2" maxlength="500"></textarea>
        </label>
        <button class="btn btn--primary" type="submit"><span data-t="send"></span></button>
        <p class="form__status" role="status"></p>
      </form>
    </section>

    <!-- Wishes -->
    <section class="section section--paper" data-section="wishes" data-needs-api>
      <h2 class="title reveal" data-t="wishes"></h2>
      <form class="form reveal" id="wishForm" novalidate>
        <label class="field">
          <span data-t="yourName"></span>
          <input name="name" maxlength="120" autocomplete="name" required />
        </label>
        <label class="field">
          <span data-t="yourWish"></span>
          <textarea name="message" rows="3" maxlength="500" required></textarea>
        </label>
        <button class="btn btn--primary" type="submit"><span data-t="sendWish"></span></button>
        <p class="form__status" role="status"></p>
      </form>
      <ul class="wishes" id="wishList" aria-live="polite"></ul>
    </section>

    <!-- Closing -->
    <footer class="closing">
      <img class="closing__img" data-fill="closingImg" alt="" loading="lazy" />
      <div class="closing__shade"></div>
      <div class="closing__text">
        <p class="closing__thanks" data-t="thanks"></p>
        <p class="closing__msg" data-fill="closingText"></p>
        <p class="closing__names" data-fill="shortNames"></p>
      </div>
    </footer>
  </main>

  <!-- Floating controls -->
  <div class="fab" id="fab">
    <button class="fab__btn" id="langBtn" type="button" aria-label="Change language"></button>
    <button class="fab__btn fab__btn--music" id="musicBtn" type="button" aria-label="Music" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    </button>
  </div>

  <!-- Photo viewer -->
  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <img id="lightboxImg" alt="" />
    <button class="lightbox__btn lightbox__close" data-lb="close" type="button" aria-label="Close">×</button>
    <button class="lightbox__btn lightbox__prev" data-lb="-1" type="button" aria-label="Previous">‹</button>
    <button class="lightbox__btn lightbox__next" data-lb="1" type="button" aria-label="Next">›</button>
  </dialog>

  <canvas id="petals" class="petals" aria-hidden="true"></canvas>
  <audio id="music" loop preload="none"></audio>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/invite.js"></script>
</body>
</html>
